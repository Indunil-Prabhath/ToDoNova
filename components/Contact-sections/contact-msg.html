<!-- Send Us a Message -->
<section class="section section--light">
  <div class="container">
    <div class="card card--light">
      <div class="card__header">
        <h2>Send Us a <span class="text-gradient">Message</span></h2>
        <p class="block__text">
          Have a question, feedback, or a brilliant feature request? Fill out
          the form below, and our team will get back to you within 24 hours.
        </p>
      </div>

      <form class="card__body">
        <div class="grid grid--1x2">
          <div class="form-group">
            <label for="full-name" class="form-label sr-only">Full Name</label>
            <input
              type="text"
              id="full-name"
              name="full-name"
              class="input"
              placeholder="Full Name"
              required
            />
          </div>

          <div class="form-group">
            <label for="email" class="form-label sr-only">Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              class="input"
              placeholder="Email Address"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label for="subject" class="form-label sr-only">Subject</label>
          <input
            type="text"
            id="subject"
            name="subject"
            class="input"
            placeholder="What would you like to talk about?"
          />
        </div>

        <div class="form-group">
          <label for="message" class="form-label sr-only">Message</label>
          <textarea
            id="message"
            name="message"
            class="input input--textarea"
            placeholder="Write your message here..."
            required
          ></textarea>
        </div>

        <label class="form-checkbox">
          <input
            type="checkbox"
            id="consent"
            name="consent"
            class="form-checkbox__input"
            required
          />
          <span class="form-checkbox__label">
            I understand that ToDoNova is currently under development, and my
            message will be used to help improve the project.
          </span>
        </label>

        <div class="form-actions">
          <button type="submit" class="btn btn--primary">Send Message</button>
        </div>
      </form>

      <div class="card__footer">
        <p class="hero__note section-quote">
          By submitting this form, you're helping us build a better productivity
          platform. We appreciate your questions, ideas, and feedback.
        </p>
      </div>
    </div>
  </div>
</section>
